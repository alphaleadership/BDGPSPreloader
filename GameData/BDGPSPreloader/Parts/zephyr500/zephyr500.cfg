PART
{
	// Missile de croisière très longue portée (500 km) pour BDGPSPreloader
	name = bdGpsPreloaderCruise500
	module = Part
	author = SI & alpha

	// --- asset parameters ---
	MODEL
	{
		model = BDArmoryExtended/Parts/Missiles/ExtendedRange/Squall/Model
		texture = LAShM, BDArmoryExtended/Parts/Missiles/ExtendedRange/Squall/LAShM
		texture = LAShMBooster, BDArmoryExtended/Parts/Missiles/ExtendedRange/Squall/LAShMBooster
	}
	rescaleFactor = 1.3 // Agrandissement à 1.3 pour représenter un missile stratégique lourd

	node_attach = 0.0, 0.2, 0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.2, 0, 0, 1, 0, 0
	node_stack_bottom = 0, 0, -1.611, 0, 0, -1, 0

	// --- editor parameters ---
	TechRequired = experimentalScience
	entryCost = 35000
	cost = 18000
	bdacategory = Missiles
	category = none
	subcategory = 0
	
	title = AS-500 'Zephyr' Strategic Cruise Missile (500km)
	manufacturer = Bahamuto Dynamics & Alpha
	description = Un missile de croisière stratégique lourd à très longue portée (500 km) conçu pour frapper des positions fortifiées ou des navires de ligne depuis une distance de sécurité extrême. Il est équipé d'une propulsion à carburant liquide de type turbo-réacteur à haut rendement lui conférant un vol de croisière subsonique de longue durée (jusqu'à 600 secondes). Il navigue par guidage GPS/inertiel, puis active son radar de recherche de cible dans la phase terminale.

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1
	
	// --- standard part parameters ---
	mass = 1.25 // Lourd, nécessite un emport adapté
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600
	bulkheadProfiles = srf
	tags = #loc_BDArmory_part_radarMissiles_tags

	MODULE
	{
		name = MissileLauncher
		shortName = AS-500

		// Propulsion à carburant liquide / croisière longue durée
		thrust = 95 // Boost initial avec booster à poudre
		cruiseThrust = 16 // Croisière économique subsonique
		dropTime = 0.5 
		boostTime = 5 
		cruiseTime = 600 // 10 minutes de vol pour couvrir 500 km à ~850 m/s
		guidanceActive = true 

		useFuel = true
		boosterFuelMass = 0.15
		cruiseFuelMass = 0.45

		decoupleSpeed = 8
		decoupleForward = false
		audioClipPath = BDArmory/Sounds/jetLoop // Bruit de réacteur pour la croisière
		boostTransformName = boosterExhaustTransform
		boostExhaustTransformName = boosterExhaustTransform
		boostExhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
		exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust

		optimumAirspeed = 850 // Vitesse de croisière subsonique constante (~Mach 2.5)

		aero = true
		liftArea = 0.015 // Plus grande portance pour planeur lourd
		dragArea = 0.002
		steerMult = 4
		maxTorque = 90
		gLimit = 15 // Moins agile en virages brusques
		maxAoA = 25

		missileType = missile
		homingType = cruise
		terminalHoming = true
		terminalHomingType = pronav

		terminalHomingRange = 15000 // Tête chercheuse activée à 15 km de la cible
		cruiseAltitude = 1200 // Croisière basse altitude pour contournement radar
		pronavGain = 3
  
		targetingType = gps // Ciblage GPS ou Radar actif
		activeRadarRange = 40000 // Radar de recherche terminal très puissant
		maxOffBoresight = 90
		lockedSensorFOV = 10

		minStaticLaunchRange = 15000
		maxStaticLaunchRange = 500000 // Portée maximale de 500 km !

		engageAir = false
		engageMissile = false
		engageGround = true
		engageSLW = false
	}

	MODULE
	{
		name = BDExplosivePart
		tntMass = 450 // Tête militaire lourde de 450 kg TNT pour cibles durcies
		warheadType = Standard
	}
}
