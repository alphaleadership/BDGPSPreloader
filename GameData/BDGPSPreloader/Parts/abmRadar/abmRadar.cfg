PART
{
// Kerbal Space Program - Part Config
// BDArmory GPS Preloader - Anti-Ballistic Missile Radar

name = bdGpsPreloaderABMRadar
module = Part
author = alpha

// --- asset parameters ---
// Utilisation du modèle 3D du grand radar de détection terrestre (radar1.mu)
mesh = radar1.mu
rescaleFactor = 2.0 // Modèle agrandi pour représenter une antenne fixe géante de détection balistique

// --- node definitions ---
node_attach = 0.0, 0, 0, 0, -1, 0, 0

// --- editor parameters ---
TechRequired = experimentalScience
entryCost = 45000
cost = 22000
category = none
bdacategory = Radars
subcategory = 0
bulkheadProfiles = srf
title = Radar Anti-Balistique (ABM) - GPS Preloader
manufacturer = Bahamuto Dynamics & Alpha
description = Ce radar longue portée fixe est orienté vers le ciel. Il est conçu pour détecter et verrouiller les cibles balistiques rentrantes ou à très haute altitude (jusqu'à 150 km d'altitude, portée 350 km). Sa zone de balayage est limitée à un cône de 90 degrés mais offre une très haute précision.

// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1
mass = 6.0
dragModelType = default
maximum_drag = 0.5
minimum_drag = 0.5
angularDrag = 3
crashTolerance = 15
maxTemp = 3600

MODULE
{
        name = ModuleRadar

        radarName = Radar Anti-Balistique (ABM)
        rwrThreatType = 0 // SAM site radar threat
        rotationTransformName = rotationTransform
        resourceDrain = 5.0 // Consommation électrique extrême

        omnidirectional = false // Faisceau sectoriel pour la défense aérienne/spatiale haute
        directionalFieldOfView = 90
        scanRotationSpeed = 150
        maxLocks = 5 // Capacité de multi-verrouillage pour intercepteurs ABM

        canScan = true
        canLock = true
        canTrackWhileScan = true
        canReceiveRadarData = true

        radarGroundClutterFactor = 0.01 // Très mauvais pour les cibles au sol, optimisé pour le ciel/espace
        radarChaffClutterFactor = 0.99 // Filtrage chaff quasi-parfait pour cibles spatiales rapides
        
        radarDetectionCurve
        {
            // Détection longue portée très sensible à haute altitude (jusqu'à 350 km)
            key = 0.0   0
            key = 50    1
            key = 150   5
            key = 250   15
            key = 350   50
        }

        radarLockTrackCurve
        {
            key = 0.0   0
            key = 50    2
            key = 150   10
            key = 250   25
            key = 350   75
        }
}

MODULE
{
	name = ModuleTurret
	pitchTransformName = pitchTransform
	yawTransformName = yawTransform
	pitchSpeedDPS = 40
	yawSpeedDPS = 40
	maxPitch = 88
	minPitch = 15 // Fixé vers le ciel
	yawRange = 120 // Cône sectoriel
	smoothRotation = true
	smoothMultiplier = 8
}
}
