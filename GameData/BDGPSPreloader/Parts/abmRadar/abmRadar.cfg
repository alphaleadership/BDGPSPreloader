PART
{
// Kerbal Space Program - Part Config
// BDArmory GPS Preloader - Anti-Ballistic Missile Radar

name = bdGpsPreloaderABMRadar
module = Part
author = alpha

// --- asset parameters ---
// Utilisation du modèle 3D du grand radar de détection terrestre (radar1.mu)
MODEL
{
	model = BDArmory/Parts/groundRadar/radar1
	texture = tex_detectionRadar, BDArmory/Parts/groundRadar/tex_detectionRadar
}
rescaleFactor = 2.0 // Modèle agrandi pour représenter une antenne fixe géante de détection balistique

// --- node definitions ---
node_attach = 0.0, 0, 0, 0, -1, 0, 0

// --- editor parameters ---
TechRequired = experimentalScience
entryCost = 45000
cost = 22000
category = none
bdacategory = Radars
subcategory = 0
bulkheadProfiles = srf
title = Radar Anti-Balistique (ABM) - GPS Preloader
manufacturer = Bahamuto Dynamics & Alpha
description = Ce radar de verrouillage et d'acquisition (Fire Control) longue portée est orienté vers le ciel. Il est conçu pour détecter et verrouiller les cibles balistiques rentrantes ou à très haute altitude (jusqu'à 150 km d'altitude, portée 350 km). Il couvre 360° en azimut pour une surveillance hémisphérique complète.

// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1
mass = 6.0
dragModelType = default
maximum_drag = 0.5
minimum_drag = 0.5
angularDrag = 3
crashTolerance = 15
maxTemp = 3600

MODULE
{
        name = ModuleRadar

        radarName = Radar Anti-Balistique (ABM)
        rwrThreatType = 0 // SAM site radar threat (Locking)
        rotationTransformName = rotationTransform
        resourceDrain = 5.0 // Consommation électrique extrême

        omnidirectional = true  // Couverture 360° complète
        directionalFieldOfView = 360
        scanRotationSpeed = 180  // Balayage très rapide
        
        // Poursuite et verrouillage ultra-agiles pour cibles hypersoniques
        lockRotationSpeed = 240  // Vitesse de suivi en lock (degrés/s)
        lockAttemptFOV = 8       // Cône d'acquisition élargi
        maxLocks = 5 

        canScan = true
        canLock = true
        canTrackWhileScan = true
        canReceiveRadarData = true

        radarGroundClutterFactor = 0.05 // Supporte un peu mieux les cibles basses
        radarChaffClutterFactor = 0.99  // Immunité aux leurres
        
        radarDetectionCurve
        {
            // Détection longue portée (jusqu'à 350 km)
            key = 0.0   0
            key = 50    0.5
            key = 150   2
            key = 250   8
            key = 350   30
        }

        radarLockTrackCurve
        {
            // Poursuite ultra-sensible (RCS requis réduit de moitié)
            key = 0.0   0
            key = 50    1
            key = 150   4
            key = 250   12
            key = 350   40
        }
}

MODULE
{
	name = ModuleTurret
	pitchTransformName = pitchTransform
	yawTransformName = yawTransform
	pitchSpeedDPS = 180 // Rotation physique ultra-rapide
	yawSpeedDPS = 180
	maxPitch = 90  // Permet de pointer droit vers le zénith
	minPitch = 0   // Descend jusqu'à l'horizon
	yawRange = 360
	smoothRotation = true
	smoothMultiplier = 20 // Suivi instantané, pas d'inertie de rotation lente
}
}
