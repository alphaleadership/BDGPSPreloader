PART
{
	// Variante sol-air (S2A) du missile stratégique à longue portée (500 km) pour BDGPSPreloader
	name = bdGpsPreloaderABM500
	module = Part
	author = SI & alpha

	// --- asset parameters ---
	MODEL
	{
		model = BDArmoryExtended/Parts/Missiles/ExtendedRange/Balrog/Model
		// Réutilisation du modèle du missile lourd à carburant solide Balrog pour l'intercepteur ABM
	}
	rescaleFactor = 1.25 // Agrandissement pour symboliser un intercepteur à très haute vélocité

	node_attach = 0.0, 0.2, 0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.2, 0, 0, 1, 0, 0
	node_stack_bottom = 0, 0, -2.1, 0, 0, -1, 0

	// --- editor parameters ---
	TechRequired = experimentalScience
	entryCost = 48000
	cost = 25000
	bdacategory = Missiles
	category = none
	subcategory = 0
	
	title = RIM-500 'Archangel' Interceptor Missile (ABM - 600km)
	manufacturer = Bahamuto Dynamics & Alpha
	description = Le RIM-500 'Archangel' est un missile d'interception sol-air (S2A) stratégique et anti-balistique ultra-rapide doté d'une portée de 600 km. Conçu pour intercepter les bombardiers à long rayon d'action, les missiles de croisière stratégiques et les véhicules spatiaux ou balistiques en phase de rentrée. Propulsé par un moteur-fusée à propergol solide à deux étages, il accélère à des vitesses hypersoniques extrêmes (Mach 6.5) en adoptant une trajectoire lobée (lofting) culminant à 55 km d'altitude. Son radar actif s'allume à 80 km pour le verrouillage terminal.

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1
	
	// --- standard part parameters ---
	mass = 1.65 // Intercepteur lourd
	dragModelType = default
	maximum_drag = 0.005 // Coefficient de traînée très faible pour pénétration atmosphérique rapide
	minimum_drag = 0.005
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 4500 // Résistance thermique accrue pour vol hypersonique
	bulkheadProfiles = srf
	tags = #loc_BDArmory_part_radarMissiles_tags

	MODULE
	{
		name = MissileLauncher
		shortName = RIM-500

		thrust = 240 // Accélération initiale fulgurante (deux étages solides)
		cruiseThrust = 85 // Poussée de sustentation hypersonique
		dropTime = 0 
		boostTime = 12 // Longue phase de boost initial
		cruiseTime = 180 // Phase de croisière de haute altitude prolongée pour atteindre 600 km
		guidanceActive = true 

		decoupleSpeed = 15
		decoupleForward = true
		audioClipPath = BDArmory/Sounds/rocketLoop
		boostTransformName = boostExhaustTransform
		boostExhaustTransformName = boostExhaustTransform
		exhaustPrefabPath = BDArmory/Models/exhaust/largeExhaust

		optimumAirspeed = 2200 // Vitesse de croisière hypersonique (~Mach 6.5)

		aero = true
		liftArea = 0.008
		dragArea = 0.002
		steerMult = 8 // Très manœuvrable malgré la vitesse grâce à des gouvernes à haute réponse
		maxTorque = 160
		gLimit = 40 // Résistance structurelle extrême pour intercepter des cibles rapides
		maxAoA = 20

		missileType = missile
		homingType = kappa
		terminalHoming = true
		terminalHomingType = pronav

		terminalHomingRange = 20000 // Verrouillage terminal préco
		LoftMaxAltitude = 55000 // Trajectoire lobée encore plus haute (55 km) pour intercepter à longue portée
		LoftRangeOverride = 100000
		LoftTermAngle = 35
		LoftAngle = 55
		kappaAngle = 30
		pronavGain = 4.5
  
		targetingType = radar
		activeRadarRange = 80000 // Radar de poursuite active terminal à très longue portée (80 km)
		maxOffBoresight = 110 // Excellente couverture
		lockedSensorFOV = 5

		minStaticLaunchRange = 8000
		maxStaticLaunchRange = 600000 // Portée maximale étendue à 600 km !

		engageAir = true
		engageMissile = true // Excellent intercepteur anti-missile
		engageGround = false
		engageSLW = false
	}

	MODULE
	{
		name = BDExplosivePart
		tntMass = 180 // Tête à fragmentation lourde de 180 kg TNT optimisée pour cibles aériennes et balistiques rapides
		warheadType = Standard
	}
}
