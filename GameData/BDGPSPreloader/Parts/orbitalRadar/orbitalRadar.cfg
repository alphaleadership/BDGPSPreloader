PART
{
// Kerbal Space Program - Part Config
// BDArmory GPS Preloader - Orbital Surveillance Radar

name = bdGpsPreloaderOrbitalRadar
module = Part
author = alpha

// --- asset parameters ---
// Utilisation du modèle 3D du dôme radar secondaire (radar2.mu)
MODEL
{
	model = BDArmory/Parts/groundRadar/radar2
	texture = tex_detectionRadar, BDArmory/Parts/groundRadar/tex_detectionRadar
}
rescaleFactor = 1.2

// --- node definitions ---
node_attach = 0.0, 0, 0, 0, -1, 0, 0

// --- editor parameters ---
TechRequired = experimentalScience
entryCost = 60000
cost = 35000
category = none
bdacategory = Radars
subcategory = 0
bulkheadProfiles = srf
title = Radar de Surveillance Orbitale (OSR) - GPS Preloader
manufacturer = Bahamuto Dynamics & Alpha
description = Conçu spécifiquement pour être monté sur des satellites ou des stations spatiales. Ce radar à synthèse d'ouverture (SAR) scanne vers le bas depuis l'orbite pour cartographier et détecter avec précision les cibles terrestres et maritimes à des distances extrêmes (jusqu'à 500 km en dessous). Il nécessite une alimentation électrique conséquente.

// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1
mass = 2.0
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 1.5
crashTolerance = 8
maxTemp = 2000 // Supporte mal les hautes températures de rentrée

MODULE
{
        name = ModuleRadar

        radarName = Radar de Surveillance Orbitale (OSR)
        rwrThreatType = 5 // Ground/satellite detection radar
        rotationTransformName = rotationTransform
        resourceDrain = 4.0 // Consommation importante

        omnidirectional = false
        directionalFieldOfView = 60 // Cône orienté vers le sol
        scanRotationSpeed = 90
        maxLocks = 10 // Capacité à suivre de nombreuses cibles au sol

        canScan = true
        canLock = true
        canTrackWhileScan = true
        canReceiveRadarData = true

        radarGroundClutterFactor = 3.5 // CONÇU pour filtrer et détecter à travers le sol (SAR orbital)
        radarChaffClutterFactor = 0.90
        
        radarDetectionCurve
        {
            // Détection longue portée descendante optimisée pour l'orbite (jusqu'à 500 km)
            key = 0.0   0
            key = 50    5
            key = 150   15
            key = 300   35
            key = 500   100
        }

        radarLockTrackCurve
        {
            key = 0.0   0
            key = 50    10
            key = 150   25
            key = 300   50
            key = 500   150
        }
}

MODULE
{
	name = ModuleTurret
	pitchTransformName = pitchTransform
	yawTransformName = yawTransform
	pitchSpeedDPS = 25
	yawSpeedDPS = 25
	maxPitch = 0
	minPitch = -90 // Oriente vers le bas (le sol) depuis l'orbite
	yawRange = 360
	smoothRotation = true
	smoothMultiplier = 5
}
}
