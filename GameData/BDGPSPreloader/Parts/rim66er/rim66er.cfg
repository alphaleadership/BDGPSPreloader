PART
{
	// Variante longue portée du RIM-66D pour BDGPSPreloader
	name = bdGpsPreloaderRIM66ER
	module = Part
	author = SuicidalInsanity & alpha

	// --- asset parameters ---
	MODEL
	{
		model = BDArmoryExtended/Parts/VLSCell/Assets/Model
	}
	rescaleFactor = 1.05 // Légèrement plus grand pour symboliser la version ER (Extended Range)

	// --- node definitions ---
	node_attach = 0.0, 0.18, 0, 0, 1, 0, 0
	node_stack_top = 0.0, 0.18, 0, 0, 1, 0, 0
	node_stack_bottom = 0, 0, -2.56, 0, 0, -1, 0

	// --- editor parameters ---
	TechRequired = experimentalScience
	entryCost = 18000
	cost = 9500
	bdacategory = Missiles
	category = none
	subcategory = 0
	
	title = RIM-66ER Standard Missile 2 (Extended Range)
	manufacturer = Bahamuto Dynamics & Alpha
	description = Une variante à portée étendue (ER) du célèbre missile RIM-66D SM-2. Doté d'une quantité accrue de carburant solide et d'un propulseur amélioré, sa portée statique de lancement est étendue à 120 km (au lieu de 50 km). Sa portée radar active passe à 60 km. Il est idéal pour intercepter des cibles à très longue distance grâce à sa trajectoire lobée (lofting).

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,0,0,1
	
	// --- standard part parameters ---
	mass = 0.880 // Plus lourd en raison du surcroît de carburant/propulseur
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600
	bulkheadProfiles = srf
	tags = #loc_BDArmory_part_radarMissiles_tags

	MODULE
	{
		name = MissileLauncher
		shortName = RIM-66ER

		thrust = 120 //KN thrust during boost phase (+20%)
		cruiseThrust = 55 //thrust during cruise phase (+22%)
		dropTime = 0 
		boostTime = 8 // Boost étendu (+2s)
		cruiseTime = 120 // Temps de vol de croisière doublé (120s vs 60s)
		guidanceActive = true 

		decoupleSpeed = 10
		decoupleForward = true
		audioClipPath = BDArmory/Sounds/rocketLoop
		boostTransformName = boostExhaustTransform
		boostExhaustTransformName = boostExhaustTransform
		exhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust

		optimumAirspeed = 1450 // Vitesse de croisière plus élevée (Mach 4.2 approx)

		aero = true
		liftArea = 0.0055
		steerMult = 6
		maxTorque = 100
  		gLimit = 28
    		maxAoA = 35

		missileType = missile
		homingType = kappa
		terminalHoming = true
		terminalHomingType = pronav

		terminalHomingRange = 8000 // Tête chercheuse activée plus tôt
		LoftMaxAltitude = 28000 // Trajectoire lobée beaucoup plus haute
		LoftRangeOverride = 25000
		LoftTermAngle = 30
		LoftAngle = 48
		kappaAngle = 30
		pronavGain = 3
  
		targetingType = radar
		activeRadarRange = 60000 // Portée radar actif doublée (60 km)
		maxOffBoresight = 90
		lockedSensorFOV = 7

		minStaticLaunchRange = 2500
		maxStaticLaunchRange = 120000 // Portée maximale étendue à 120 km (vs 50 km)

		engageAir = true
		engageMissile = true
		engageGround = true
		engageSLW = false
	}

	MODULE
	{
		name = BDExplosivePart
		tntMass = 115 // Charge militaire accrue (+17%)
		warheadType = Standard
	}
}
