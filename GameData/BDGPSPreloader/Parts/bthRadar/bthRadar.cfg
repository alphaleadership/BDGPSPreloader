PART
{
// Kerbal Space Program - Part Config
// BDArmory GPS Preloader - Beyond The Horizon Radar

name = bdGpsPreloaderBTHRadar
module = Part
author = alpha

// --- asset parameters ---
// Utilisation du modèle 3D du grand radar AWACS de BDArmory
MODEL
{
	model = BDArmory/Parts/awacsRadar/model
	texture = tex_awacs, BDArmory/Parts/awacsRadar/tex_awacs
}
rescaleFactor = 1.8 // Plus grand pour simuler une antenne BTH terrestre géante

// --- node definitions ---
node_attach = 0.0, 0, 0, 0, -1, 0, 0

// --- editor parameters ---
TechRequired = experimentalScience
entryCost = 32000
cost = 15000
category = none
bdacategory = Radars
subcategory = 0
bulkheadProfiles = srf
title = Radar BTH (Beyond The Horizon) - GPS Preloader
manufacturer = Bahamuto Dynamics & Alpha
description = Un radar géant trans-horizon conçu pour détecter des cibles à des distances extrêmes (jusqu'à 250 km). En raison de sa longueur d'onde et de la courbure terrestre, il a une résolution plus faible mais permet d'avoir un pré-remplissage GPS à très longue distance.

// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 0,1,0,0,1
mass = 4.5
dragModelType = default
maximum_drag = 0.4
minimum_drag = 0.4
angularDrag = 3
crashTolerance = 12
maxTemp = 3600

MODULE
{
        name = ModuleRadar

        radarName = Radar Trans-Horizon (BTH)
        rwrThreatType = 5 // Ground detection radar
        rotationTransformName = rotationTransform
        resourceDrain = 3.5 // Consomme beaucoup d'énergie

        omnidirectional = true
        directionalFieldOfView = 360
        scanRotationSpeed = 45 // Vitesse lente pour antenne massive
        maxLocks = 3

        canScan = true
        canLock = true
        canTrackWhileScan = true
        canReceiveRadarData = true

        radarGroundClutterFactor = 0.4 // Meilleure efficacité sur horizon
        radarChaffClutterFactor = 0.85
        
        radarDetectionCurve
        {
            // Détection longue portée (jusqu'à 250 km) mais nécessite une grande signature (RCS)
            key = 0.0   0
            key = 20    5
            key = 50    15
            key = 120   40
            key = 250   150
        }

        radarLockTrackCurve
        {
            key = 0.0   0
            key = 20    10
            key = 50    25
            key = 120   60
            key = 250   200
        }
}

MODULE
{
	name = ModuleTurret
	pitchTransformName = pitchTransform
	yawTransformName = yawTransform
	pitchSpeedDPS = 10
	yawSpeedDPS = 10
	maxPitch = 30
	minPitch = -2
	yawRange = 360
	smoothRotation = true
	smoothMultiplier = 5
}
}
