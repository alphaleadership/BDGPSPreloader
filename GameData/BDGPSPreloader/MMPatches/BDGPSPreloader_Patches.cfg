// ============================================================
// PATCH DISTANCE DE CIBLAGE BDARMORY — BDGPSPreloader
// Étend les limites de portée globales de BDArmory pour
// permettre le ciblage longue portée (500 km) de nos pièces.
// ============================================================

// --- 1. Paramètres globaux BDArmory (BDArmorySettings) ------
//
// MAX_GUARD_RANGE      : portée maximale du mode Guard AI (m)
//                        Défaut BDArmory : 5 000 m → on monte à 500 000 m
// MAX_ENGAGEMENT_RANGE : portée max d'engagement manuel (m)
//                        Défaut BDArmory : 100 000 m → on monte à 600 000 m
// RADAR_WINDOW_SCALE   : mise à l'échelle de la fenêtre radar (visuel seulement)
//
@BDArmorySettings:NEEDS[BDArmory]:FOR[BDGPSPreloader]
{
    // Portée du mode Guard étendue à 500 km (correspond à nos missiles 500 km)
    %MAX_GUARD_RANGE = 500000

    // Portée d'engagement étendue à 600 km (marge au-delà de la portée max missile)
    %MAX_ENGAGEMENT_RANGE = 600000

    // Distance max de verrouillage radar (si exposé comme setting)
    %MAX_TARGET_RANGE = 600000
}


// --- 2. Patch sur TOUS les ModuleRadar existants de BDArmory -
//
// Étend les courbes radarDetectionCurve et radarLockTrackCurve
// des radars stock de BDArmory pour qu'ils puissent détecter
// et verrouiller au-delà de leur portée d'origine.
// On ajoute un point à 500 km sans supprimer les points existants.
//
// ATTENTION : ce patch ne touche QUE les pièces BDArmory vanilla,
// pas nos pièces custom (déjà configurées dans leurs .cfg).
//
@PART[*]:HAS[@MODULE[ModuleRadar]]:NEEDS[BDArmory]:FOR[BDGPSPreloader]
{
    @MODULE[ModuleRadar]
    {
        // Étendre la portée de détection — ajoute un point à 500 km
        // Les points intermédiaires existants sont conservés
        @radarDetectionCurve
        {
            key = 500 500
        }

        // Étendre la portée de verrouillage — ajoute un point à 500 km
        @radarLockTrackCurve
        {
            key = 500 500
        }

        // Augmenter le nombre de verrous simultanés si non défini
        %maxLocks = 10
    }
}


// --- 3. Patch sur TOUS les MissileLauncher existants de BDArmory -
//
// Étend maxStaticLaunchRange des missiles stock BDArmory
// qui auraient une portée inférieure à 500 km,
// pour qu'ils puissent être tirés depuis nos radars longue portée.
// On ne touche pas les missiles déjà configurés avec 500 000+.
//
@PART[*]:HAS[@MODULE[MissileLauncher]]:NEEDS[BDArmory]:FOR[BDGPSPreloader]
{
    @MODULE[MissileLauncher]
    {
        // Étend la portée de lancement statique à 500 km si elle est inférieure
        @maxStaticLaunchRange ^= :^(\d+)$:500000:
    }
}


// --- 4. Patch MissileFire (Weapon Manager) -------------------
//
// guardRange      : portée du mode Guard sur le Weapon Manager
// targetScanInterval : fréquence de scan des cibles (réduit pour LP)
//
@PART[*]:HAS[@MODULE[MissileFire]]:NEEDS[BDArmory]:FOR[BDGPSPreloader]
{
    @MODULE[MissileFire]
    {
        // Portée du mode Guard sur chaque Weapon Manager
        %guardRange = 500000

        // Intervalle de scan réduit pour compenser la longue portée
        %targetScanInterval = 0.5
    }
}

