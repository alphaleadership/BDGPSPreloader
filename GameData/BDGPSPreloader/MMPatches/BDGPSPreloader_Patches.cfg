// Patch ModuleManager pour ajouter la compatibilité TweakScale aux radars de BDGPSPreloader

@PART[bdGpsPreloaderBTHRadar]:NEEDS[TweakScale]
{
    %MODULE[TweakScale]
    {
        type = free
    }
}

@PART[bdGpsPreloaderABMRadar]:NEEDS[TweakScale]
{
    %MODULE[TweakScale]
    {
        type = free
    }
}

@PART[bdGpsPreloaderOrbitalRadar]:NEEDS[TweakScale]
{
    %MODULE[TweakScale]
    {
        type = free
    }
}

// Support pour VABOrganizer (permet d'afficher les pièces dans le sous-dossier BD Armory du VAB)
@PART[bdGpsPreloaderBTHRadar]:FOR[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = AWACS
  }
}

@PART[bdGpsPreloaderABMRadar]:FOR[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = Locking
  }
}

@PART[bdGpsPreloaderOrbitalRadar]:FOR[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = Detection
  }
}

// Support TweakScale pour RIM-66ER
@PART[bdGpsPreloaderRIM66ER]:NEEDS[TweakScale]
{
    %MODULE[TweakScale]
    {
        type = surface
        minScale = 0.5
        maxScale = 2.0
        defaultScale = 1.0
    }
}

// Support VABOrganizer pour RIM-66ER (Placé dans les missiles sol-air / S2A de BDArmory)
@PART[bdGpsPreloaderRIM66ER]:FOR[VABOrganizer]
{
  %VABORGANIZER
  {
    %organizerSubcategory = S2A
  }
}

