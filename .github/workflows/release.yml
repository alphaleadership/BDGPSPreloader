name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore BDGPSPreloader.csproj

    - name: Build
      run: dotnet build BDGPSPreloader.csproj --configuration Release

    - name: Create Release Package
      run: |
        mkdir -p release/GameData/BDGPSPreloader/Plugins
        mkdir -p release/GameData/BDGPSPreloader/Parts
        mkdir -p release/GameData/BDGPSPreloader/MMPatches
        # DLL compilée
        cp bin/Release/net472/BDGPSPreloader.dll release/GameData/BDGPSPreloader/Plugins/
        # Fichier .version pour KSP AVC / CKAN
        cp GameData/BDGPSPreloader/BDGPSPreloader.version release/GameData/BDGPSPreloader/
        # Parts et patches MM
        cp -r GameData/BDGPSPreloader/Parts/* release/GameData/BDGPSPreloader/Parts/
        cp -r GameData/BDGPSPreloader/MMPatches/* release/GameData/BDGPSPreloader/MMPatches/
        # Création du zip
        cd release
        zip -r ../BDGPSPreloader.zip GameData/

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: BDGPSPreloader.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
