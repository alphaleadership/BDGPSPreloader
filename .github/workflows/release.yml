name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x' # Version du SDK pour compiler le projet

    # BDArmory et KSP DLLs sont généralement nécessaires pour compiler.
    # Dans ce cas, nous téléchargeons des versions publiques légères ou fictives (stubs)
    # ou nous utilisons les références du dépôt si elles y sont poussées.
    # Pour ce workflow générique, nous créons la structure de build.
    - name: Restore dependencies
      run: dotnet restore BDGPSPreloader.csproj

    - name: Build
      run: dotnet build BDGPSPreloader.csproj --configuration Release

    - name: Create Release Package
      run: |
        mkdir -p release/GameData/BDGPSPreloader/Plugins
        cp bin/Release/net472/BDGPSPreloader.dll release/GameData/BDGPSPreloader/Plugins/
        # Copie de l'icône si présente
        # cp -r Textures release/GameData/BDGPSPreloader/
        cd release
        zip -r ../BDGPSPreloader.zip GameData/

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: BDGPSPreloader.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
